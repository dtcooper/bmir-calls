[tool.poetry]
name = "bmir-calls"
version = "0.0.1"
description = "BMIR Call Board"
authors = ["\"David Cooper\" <david.cooper@burningman.org>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.2"
django-constance = "^4.1.2"
django-environ = "^0.11.2"
django-ninja = "^1.3.0"
django-phonenumber-field = {extras = ["phonenumberslite"], version = "^8.0.0"}
gunicorn = "^23.0.0"
psycopg = "^3.2.3"
twilio = "^9.3.6"
wait-for-it = "^2.3.0"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
django-debug-toolbar = "^4.4.6"
django-extensions = "^3.2.3"
flake8 = "^7.1.1"
ipdb = "^0.13.13"
ipython = "^8.29.0"
isort = "^5.13.2"
pywatchman = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]
preview = true
enable-unstable-feature = [
    "multiline_string_handling", "string_processing", "wrap_long_dict_values_in_parens",
    "hex_codes_in_unicode_sequences", "hug_parens_with_braces_and_square_brackets"
]

[tool.isort]
multi_line_output = 3
lines_after_imports = 2
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
force_sort_within_sections = true
combine_as_imports = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'DJANGO', 'DJANGOTHIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
known_django = ['django']
known_djangothirdparty = ['environ', 'ninja', 'constance', 'django_jsonform', 'phonenumber_field']
skip = ['migrations']
