[tool.poetry]
name = "bmir-calls"
version = "0.0.1"
description = "BMIR Call Routing Software"
authors = ["David Cooper <david.cooper@burningman.org>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-multipart = "^0.0.16"
starlette = "^0.41.2"
twilio = "^9.3.6"
uvicorn = "^0.32.0"
peewee-aio = {extras = ["aiosqlite"], version = "^2.0.0"}


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
ipdb = "^0.13.13"
ipython = "^8.29.0"
isort = "^5.13.2"
watchfiles = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]
preview = true
enable-unstable-feature = [
    "multiline_string_handling", "string_processing", "wrap_long_dict_values_in_parens",
    "hex_codes_in_unicode_sequences", "hug_parens_with_braces_and_square_brackets"
]

[tool.isort]
multi_line_output = 3
lines_after_imports = 2
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
force_sort_within_sections = true
combine_as_imports = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'STARLETTE', 'STARLETTETHIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
known_starlette = ['starlette']
known_starlettethirdparty = []
